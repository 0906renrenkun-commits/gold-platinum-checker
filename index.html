verdict.textContent = "今は待ち";
    difference.textContent =
      diff.toLocaleString() + "円/g 高い";

    message.textContent =
      "現在価格より5%以上高いので、急いで買わず相場を見ながら待つのがおすすめです。";
  }

  result.scrollIntoView({
    behavior: "smooth"
  });
}

</script>
